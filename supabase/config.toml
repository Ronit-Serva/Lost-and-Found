project_id = "ashoka-lost-and-found"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

[studio]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**"]
enable_signup = true

[auth.email]
enabled = false

[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/public/allow_ashoka_google_signup"

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
redirect_uri = ""
skip_nonce_check = false

[functions.report-photo]
enabled = true
verify_jwt = true
import_map = "./functions/deno.json"
entrypoint = "./functions/report-photo/index.ts"

